<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sketch3D CAD Pro - Print Ready</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --card: #1e293b;
      --border: #334155;
      --accent: #2563eb;
      --accent-light: #38bdf8;
      --danger: #ef4444;
      --hole: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* HEADER */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-light);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #0284c7;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:active { opacity: 0.8; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.danger { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #fca5a5; }

    /* TABS 2D / 3D */
    .tab-bar {
      display: flex;
      background: #060911;
      border-bottom: 1px solid var(--border);
      padding: 5px;
      gap: 5px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--accent-light);
      border: 1px solid var(--border);
    }

    /* WORKSPACE */
    .main-view {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #view2D {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    /* BARRA DE HERRAMIENTAS DE DIBUJO */
    .toolbar-scroll {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tool-item {
      padding: 7px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tool-item.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
    }

    /* CANVAS 2D */
    .canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
      background: #070a12;
    }

    canvas#cadCanvas {
      background: #0f172a;
      border-radius: 8px;
      border: 2px solid var(--border);
      touch-action: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .canvas-hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--muted);
      pointer-events: none;
      white-space: nowrap;
    }

    /* PANEL INSPECTOR DE PROPIEDADES */
    .inspector {
      background: var(--panel);
      margin: 8px 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inspector-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .prop-box {
      background: var(--card);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prop-label {
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .prop-label b {
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
      height: 20px;
      accent-color: var(--accent);
    }

    .mode-switch {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      flex: 1;
      padding: 7px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.solid.active {
      background: rgba(37, 99, 235, 0.25);
      border-color: var(--accent-light);
      color: #fff;
    }

    .mode-btn.hole.active {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--hole);
      color: #fde68a;
    }

    /* LISTA DE CAPAS / OBJETOS */
    .layers-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .layer-chip {
      padding: 5px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.73rem;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .layer-chip.selected {
      border-color: var(--accent-light);
      background: rgba(56, 189, 248, 0.15);
      font-weight: 600;
    }

    /* VISTA 3D */
    #view3D {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #viewportWebGL {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .floating-3d-ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .metrics-pill {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.4;
      pointer-events: auto;
    }

    .cam-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }
  </style>

  <!-- Three.js y OrbitControls estables -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚙️ Sketch3D Pro</span>
      <span class="badge">CAD / STL</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="btnSnap">🧲 Imán: ON</button>
      <button class="btn primary" id="btnExport">📥 STL</button>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabDraw">📐 1. Boceto 2D y Piezas</button>
    <button class="tab-btn" id="tab3D">🧊 2. Modelo 3D Interactivo</button>
  </div>

  <div class="main-view">
    <!-- ==================== VISTA 2D ==================== -->
    <div id="view2D">
      <!-- Barra de Herramientas -->
      <div class="toolbar-scroll">
        <button class="tool-item active" data-tool="select">👆 Mover / Selec.</button>
        <button class="tool-item" data-tool="nodes">🔧 Editar Nodos</button>
        <button class="tool-item" data-tool="freehand">✏️ Trazo Libre</button>
        <button class="tool-item" id="addRect">⬛ + Rectángulo</button>
        <button class="tool-item" id="addCircle">⚪ + Círculo / Agujero</button>
        <button class="tool-item" id="addHex">🛑 + Hexágono</button>
      </div>

      <!-- Lienzo CAD -->
      <div class="canvas-container">
        <canvas id="cadCanvas" width="330" height="330"></canvas>
        <div class="canvas-hud" id="hudText">Cama: 220x220 mm | Cuadrícula: 10 mm</div>
      </div>

      <!-- Lista de Formas Creadas -->
      <div class="inspector">
        <div class="inspector-title">
          <span>Piezas en el Boceto</span>
          <div style="display:flex; gap:6px;">
            <button class="btn" id="btnDuplicate" style="padding:3px 8px; font-size:0.7rem;">📋 Duplicar</button>
            <button class="btn danger" id="btnDelete" style="padding:3px 8px; font-size:0.7rem;">🗑 Borrar</button>
          </div>
        </div>
        <div class="layers-bar" id="layersList"></div>
      </div>

      <!-- Propiedades de la Forma Seleccionada -->
      <div class="inspector" id="propPanel">
        <div class="inspector-title">
          <span id="selectedName">Propiedades de Pieza</span>
          <button class="btn" id="btnSmoothShape" style="padding:3px 8px; font-size:0.7rem;">✨ Suavizar</button>
        </div>

        <!-- Modo Booleano: Sólido vs Agujero -->
        <div class="mode-switch">
          <button class="mode-btn solid active" id="btnSetSolid">➕ Sólido (Extruir)</button>
          <button class="mode-btn hole" id="btnSetHole">➖ Agujero (Perforar)</button>
        </div>

        <div class="row-grid">
          <div class="prop-box">
            <div class="prop-label"><span>Altura Z</span><b id="lblHeight">10 mm</b></div>
            <input type="range" id="slHeight" min="1" max="60" step="1" value="10">
          </div>

          <div class="prop-box">
            <div class="prop-label"><span>Escala / Tamaño</span><b id="lblScale">100%</b></div>
            <input type="range" id="slScale" min="20" max="250" step="5" value="100">
          </div>

          <div class="prop-box">
            <div class="prop-label"><span>Rotación 2D</span><b id="lblRot">0°</b></div>
            <input type="range" id="slRot" min="0" max="360" step="5" value="0">
          </div>

          <div class="prop-box">
            <div class="prop-label"><span>Bisel Borde</span><b id="lblBevel">0.5 mm</b></div>
            <input type="range" id="slBevel" min="0" max="3" step="0.2" value="0.5">
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== VISTA 3D ==================== -->
    <div id="view3D">
      <div class="floating-3d-ui">
        <div class="metrics-pill" id="metrics3D">
          Dimensiones totales:<br>
          Calculando...
        </div>
        <div class="cam-btns">
          <button class="btn" id="btnCamTop">⬇️ Planta</button>
          <button class="btn" id="btnCamIso">📐 Iso</button>
          <button class="btn" id="btnWireframe">🕸 Malla</button>
        </div>
      </div>
      <div id="viewportWebGL"></div>
    </div>
  </div>

  <script>
    /* =========================================================
       SISTEMA DE UNIDADES Y ESTADO CAD
       Cama: 220 x 220 mm | Canvas: 330 x 330 px (1 mm = 1.5 px)
       ========================================================= */
    const BED_MM = 220;
    const CANVAS_PX = 330;
    const PX_TO_MM = BED_MM / CANVAS_PX; // ~0.6667 mm por pixel
    const MM_TO_PX = CANVAS_PX / BED_MM; // 1.5 px por mm

    let shapes = [];
    let selectedId = null;
    let activeTool = 'select'; // 'select', 'nodes', 'freehand'
    let snapEnabled = true;

    // Interacción en Canvas
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let draggedNodeIdx = -1;
    let currentFreehandPts = [];

    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');

    // Utilidad para generar puntos de polígonos o círculos
    function createPolygonPts(cx, cy, radiusMm, sides) {
      const pts = [];
      const rPx = radiusMm * MM_TO_PX;
      for (let i = 0; i < sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        pts.push({ x: cx + Math.cos(a) * rPx, y: cy + Math.sin(a) * rPx });
      }
      return pts;
    }

    function createRectPts(cx, cy, wMm, hMm) {
      const w = (wMm * MM_TO_PX) / 2;
      const h = (hMm * MM_TO_PX) / 2;
      return [
        { x: cx - w, y: cy - h },
        { x: cx + w, y: cy - h },
        { x: cx + w, y: cy + h },
        { x: cx - w, y: cy + h }
      ];
    }

    // Agregar figura al estado
    function addShape(name, points, isHole = false, height = 10) {
      const id = 'shp_' + Date.now() + '_' + Math.floor(Math.random() * 100);
      // Guardar puntos relativos al centroide para poder rotar y escalar fácil
      const center = getCentroid(points);
      const relPoints = points.map(p => ({ x: p.x - center.x, y: p.y - center.y }));

      const newShape = {
        id,
        name,
        cx: center.x,
        cy: center.y,
        relPoints,
        isHole,
        height,
        scale: 1,
        rotation: 0, // grados
        bevel: 0.4
      };
      shapes.push(newShape);
      selectShape(id);
      render2D();
    }

    function getCentroid(pts) {
      let sx = 0, sy = 0;
      pts.forEach(p => { sx += p.x; sy += p.y; });
      return { x: sx / pts.length, y: sy / pts.length };
    }

    // Obtener los puntos absolutos en el canvas considerando posición, escala y rotación
    function getWorldPoints(shp) {
      const rad = (shp.rotation * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      return shp.relPoints.map(p => {
        const sx = p.x * shp.scale;
        const sy = p.y * shp.scale;
        return {
          x: shp.cx + (sx * cos - sy * sin),
          y: shp.cy + (sx * sin + sy * cos)
        };
      });
    }

    // Convertir un punto absoluto a relativo de la pieza (para edición de nodos)
    function updateNodeFromWorld(shp, nodeIdx, worldX, worldY) {
      const rad = (-shp.rotation * Math.PI) / 180;
      const dx = worldX - shp.cx;
      const dy = worldY - shp.cy;
      const rx = (dx * Math.cos(rad) - dy * Math.sin(rad)) / shp.scale;
      const ry = (dx * Math.sin(rad) + dy * Math.cos(rad)) / shp.scale;
      shp.relPoints[nodeIdx] = { x: rx, y: ry };
    }

    function snapCoord(valPx) {
      if (!snapEnabled) return valPx;
      const stepPx = 5 * MM_TO_PX; // Imán cada 5 mm
      const center = CANVAS_PX / 2;
      return center + Math.round((valPx - center) / stepPx) * stepPx;
    }

    /* =========================================================
       RENDERIZADO 2D (CANVAS CAD)
       ========================================================= */
    function render2D() {
      ctx.clearRect(0, 0, CANVAS_PX, CANVAS_PX);

      // 1. Cuadrícula milimétrica (cada 10 mm = 15 px)
      const step10mm = 10 * MM_TO_PX;
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i <= CANVAS_PX; i += step10mm) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_PX);
        ctx.moveTo(0, i); ctx.lineTo(CANVAS_PX, i);
        ctx.stroke();
      }

      // Ejes centrales X / Y
      const mid = CANVAS_PX / 2;
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mid, 0); ctx.lineTo(mid, CANVAS_PX);
      ctx.moveTo(0, mid); ctx.lineTo(CANVAS_PX, mid);
      ctx.stroke();

      // 2. Dibujar cada forma
      shapes.forEach(shp => {
        const pts = getWorldPoints(shp);
        if (pts.length < 2) return;

        const isSel = shp.id === selectedId;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.closePath();

        if (shp.isHole) {
          ctx.fillStyle = isSel ? 'rgba(245, 158, 11, 0.35)' : 'rgba(245, 158, 11, 0.15)';
          ctx.strokeStyle = isSel ? '#fbbf24' : '#d97706';
          ctx.setLineDash([5, 4]);
        } else {
          ctx.fillStyle = isSel ? 'rgba(56, 189, 248, 0.3)' : 'rgba(37, 99, 235, 0.18)';
          ctx.strokeStyle = isSel ? '#38bdf8' : '#3b82f6';
          ctx.setLineDash([]);
        }

        ctx.lineWidth = isSel ? 2.5 : 1.5;
        ctx.fill();
        ctx.stroke();
        ctx.setLineDash([]);

        // Centro y cotas de la figura seleccionada
        if (isSel) {
          // Punto de pivote central
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(shp.cx, shp.cy, 4, 0, Math.PI * 2);
          ctx.fill();

          // Calcular Ancho y Alto en mm para mostrar cota en vivo
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          pts.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
          });
          const wMm = ((maxX - minX) * PX_TO_MM).toFixed(1);
          const hMm = ((maxY - minY) * PX_TO_MM).toFixed(1);

          document.getElementById('hudText').innerText = `${shp.name}: ${wMm} x ${hMm} mm | Z: ${shp.height} mm`;

          // Si estamos en modo Editar Nodos, dibujar los vértices manipulables
          if (activeTool === 'nodes') {
            pts.forEach((p, idx) => {
              ctx.fillStyle = idx === draggedNodeIdx ? '#ef4444' : '#ffffff';
              ctx.strokeStyle = '#0f172a';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            });
          }
        }
      });

      // 3. Dibujar trazo libre en curso
      if (activeTool === 'freehand' && currentFreehandPts.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.moveTo(currentFreehandPts[0].x, currentFreehandPts[0].y);
        for (let i = 1; i < currentFreehandPts.length; i++) {
          ctx.lineTo(currentFreehandPts[i].x, currentFreehandPts[i].y);
        }
        ctx.stroke();
      }
    }

    /* =========================================================
       INTERACCIÓN TÁCTIL Y MOUSE EN CANVAS
       ========================================================= */
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // Algoritmo Ray-Casting para saber si se tocó dentro de un polígono
    function pointInPoly(pt, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function onDown(e) {
      e.preventDefault();
      const pos = getPos(e);

      if (activeTool === 'freehand') {
        isDragging = true;
        currentFreehandPts = [pos];
        render2D();
        return;
      }

      const selShape = shapes.find(s => s.id === selectedId);

      // Si estamos en modo Nodos, verificar si tocó un vértice
      if (activeTool === 'nodes' && selShape) {
        const pts = getWorldPoints(selShape);
        for (let i = 0; i < pts.length; i++) {
          if (Math.hypot(pos.x - pts[i].x, pos.y - pts[i].y) < 16) {
            isDragging = true;
            draggedNodeIdx = i;
            render2D();
            return;
          }
        }
      }

      // Modo Selección / Mover: buscar de arriba hacia abajo qué pieza fue tocada
      for (let i = shapes.length - 1; i >= 0; i--) {
        const shp = shapes[i];
        const pts = getWorldPoints(shp);
        if (pointInPoly(pos, pts)) {
          selectShape(shp.id);
          isDragging = true;
          dragStart = { x: pos.x - shp.cx, y: pos.y - shp.cy };
          render2D();
          return;
        }
      }
    }

    function onMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const pos = getPos(e);

      if (activeTool === 'freehand') {
        const last = currentFreehandPts[currentFreehandPts.length - 1];
        if (Math.hypot(pos.x - last.x, pos.y - last.y) > 5) {
          currentFreehandPts.push(pos);
          render2D();
        }
        return;
      }

      const selShape = shapes.find(s => s.id === selectedId);
      if (!selShape) return;

      if (activeTool === 'nodes' && draggedNodeIdx !== -1) {
        const sx = snapCoord(pos.x);
        const sy = snapCoord(pos.y);
        updateNodeFromWorld(selShape, draggedNodeIdx, sx, sy);
        render2D();
        return;
      }

      if (activeTool === 'select') {
        selShape.cx = snapCoord(pos.x - dragStart.x);
        selShape.cy = snapCoord(pos.y - dragStart.y);
        render2D();
      }
    }

    function onUp(e) {
      if (!isDragging) return;
      isDragging = false;
      draggedNodeIdx = -1;

      if (activeTool === 'freehand') {
        if (currentFreehandPts.length > 3) {
          addShape(`Trazo ${shapes.length + 1}`, currentFreehandPts, false, 8);
          setTool('select');
        }
        currentFreehandPts = [];
      }
      render2D();
    }

    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp, { passive: false });
    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    /* =========================================================
       UI DE CAPAS, HERRAMIENTAS E INSPECTOR
       ========================================================= */
    function setTool(toolName) {
      activeTool = toolName;
      document.querySelectorAll('.tool-item[data-tool]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === toolName);
      });
      render2D();
    }

    document.querySelectorAll('.tool-item[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.tool));
    });

    // Botones de agregar primitivas
    const mid = CANVAS_PX / 2;
    document.getElementById('addRect').addEventListener('click', () => {
      addShape(`Placa ${shapes.length + 1}`, createRectPts(mid, mid, 60, 40), false, 8);
      setTool('select');
    });

    document.getElementById('addCircle').addEventListener('click', () => {
      // Por defecto crea un círculo ideal para agujero o cilindro
      const isHoleDefault = shapes.length > 0;
      addShape(isHoleDefault ? `Agujero ${shapes.length + 1}` : `Cilindro ${shapes.length + 1}`, createPolygonPts(mid, mid, 12, 28), isHoleDefault, 10);
      setTool('select');
    });

    document.getElementById('addHex').addEventListener('click', () => {
      addShape(`Hexágono ${shapes.length + 1}`, createPolygonPts(mid, mid, 20, 6), false, 12);
      setTool('select');
    });

    // Selección y sincronización del Inspector
    function selectShape(id) {
      selectedId = id;
      updateLayersUI();
      const shp = shapes.find(s => s.id === id);
      const panel = document.getElementById('propPanel');
      if (!shp) {
        panel.style.opacity = '0.4';
        panel.style.pointerEvents = 'none';
        return;
      }
      panel.style.opacity = '1';
      panel.style.pointerEvents = 'auto';

      document.getElementById('selectedName').innerText = shp.name;
      document.getElementById('btnSetSolid').classList.toggle('active', !shp.isHole);
      document.getElementById('btnSetHole').classList.toggle('active', shp.isHole);

      document.getElementById('slHeight').value = shp.height;
      document.getElementById('lblHeight').innerText = `${shp.height} mm`;

      const scPct = Math.round(shp.scale * 100);
      document.getElementById('slScale').value = scPct;
      document.getElementById('lblScale').innerText = `${scPct}%`;

      document.getElementById('slRot').value = shp.rotation;
      document.getElementById('lblRot').innerText = `${shp.rotation}°`;

      document.getElementById('slBevel').value = shp.bevel;
      document.getElementById('lblBevel').innerText = `${shp.bevel} mm`;
    }

    function updateLayersUI() {
      const container = document.getElementById('layersList');
      container.innerHTML = '';
      shapes.forEach(shp => {
        const chip = document.createElement('div');
        chip.className = `layer-chip ${shp.id === selectedId ? 'selected' : ''}`;
        chip.innerHTML = `<span>${shp.isHole ? '➖' : '➕'}</span><span>${shp.name}</span>`;
        chip.addEventListener('click', () => {
          selectShape(shp.id);
          render2D();
        });
        container.appendChild(chip);
      });
    }

    // Eventos del Inspector
    document.getElementById('btnSetSolid').addEventListener('click', () => {
      const shp = shapes.find(s => s.id === selectedId);
      if (shp) { shp.isHole = false; selectShape(shp.id); render2D(); }
    });

    document.getElementById('btnSetHole').addEventListener('click', () => {
      const shp = shapes.find(s => s.id === selectedId);
      if (shp) { shp.isHole = true; selectShape(shp.id); render2D(); }
    });

    document.getElementById('slHeight').addEventListener('input', e => {
      const shp = shapes.find(s => s.id === selectedId);
      if (shp) {
        shp.height = parseFloat(e.target.value);
        document.getElementById('lblHeight').innerText = `${shp.height} mm`;
        render2D();
      }
    });

    document.getElementById('slScale').addEventListener('input', e => {
      const shp = shapes.find(s => s.id === selectedId);
      if (shp) {
        shp.scale = parseFloat(e.target.value) / 100;
        document.getElementById('lblScale').innerText = `${e.target.value}%`;
        render2D();
      }
    });

    document.getElementById('slRot').addEventListener('input', e => {
      const shp = shapes.find(s => s.id === selectedId);
      if (shp) {
        shp.rotation = parseFloat(e.target.value);
        document.getElementById('lblRot').innerText = `${shp.rotation}°`;
        render2D();
      }
    });

    document.getElementById('slBevel').addEventListener('input', e => {
      const shp = shapes.find(s => s.id === selectedId);
      if (shp) {
        shp.bevel = parseFloat(e.target.value);
        document.getElementById('lblBevel').innerText = `${shp.bevel} mm`;
      }
    });

    // Suavizado subdividiendo y promediando vértices (Algoritmo Chaikin)
    document.getElementById('btnSmoothShape').addEventListener('click', () => {
      const shp = shapes.find(s => s.id === selectedId);
      if (!shp || shp.relPoints.length < 3 || shp.relPoints.length > 80) return;
      const pts = shp.relPoints;
      const next = [];
      for (let i = 0; i < pts.length; i++) {
        const p0 = pts[i];
        const p1 = pts[(i + 1) % pts.length];
        next.push({ x: 0.75 * p0.x + 0.25 * p1.x, y: 0.75 * p0.y + 0.25 * p1.y });
        next.push({ x: 0.25 * p0.x + 0.75 * p1.x, y: 0.25 * p0.y + 0.75 * p1.y });
      }
      shp.relPoints = next;
      render2D();
    });

    // Duplicar y Borrar
    document.getElementById('btnDuplicate').addEventListener('click', () => {
      const shp = shapes.find(s => s.id === selectedId);
      if (!shp) return;
      const copyPts = getWorldPoints(shp).map(p => ({ x: p.x + 15, y: p.y + 15 }));
      addShape(shp.name + ' (Copia)', copyPts, shp.isHole, shp.height);
    });

    document.getElementById('btnDelete').addEventListener('click', () => {
      if (!selectedId) return;
      shapes = shapes.filter(s => s.id !== selectedId);
      selectedId = shapes.length > 0 ? shapes[shapes.length - 1].id : null;
      selectShape(selectedId);
      render2D();
    });

    document.getElementById('btnSnap').addEventListener('click', e => {
      snapEnabled = !snapEnabled;
      e.target.innerText = `🧲 Imán: ${snapEnabled ? 'ON' : 'OFF'}`;
    });

    /* =========================================================
       MOTOR 3D Y OPERACIONES BOOLEANAS DE PERFORACIÓN
       ========================================================= */
    const view2D = document.getElementById('view2D');
    const view3D = document.getElementById('view3D');
    const container3D = document.getElementById('viewportWebGL');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    const camera = new THREE.PerspectiveCamera(45, 1, 1, 1200);
    camera.position.set(0, -190, 180);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container3D.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(100, -100, 200);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(BED_MM, 22, 0x0284c7, 0x1e293b);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    let meshGroup = new THREE.Group();
    scene.add(meshGroup);
    let isWireframe = false;

    function build3DScene() {
      // Limpiar grupo anterior
      while (meshGroup.children.length > 0) {
        const m = meshGroup.children[0];
        m.geometry.dispose();
        meshGroup.remove(m);
      }

      const solids = shapes.filter(s => !s.isHole);
      const holes = shapes.filter(s => s.isHole);
      const centerPx = CANVAS_PX / 2;

      // Convertir puntos en píxeles a coordenadas en milímetros centradas en la cama
      function toMMPoints(shp) {
        return getWorldPoints(shp).map(p => new THREE.Vector2(
          (p.x - centerPx) * PX_TO_MM,
          -(p.y - centerPx) * PX_TO_MM
        ));
      }

      solids.forEach(solid => {
        const sPts = toMMPoints(solid);
        if (sPts.length < 3) return;

        const threeShape = new THREE.Shape(sPts);

        // Perforar todos los agujeros cuyo centro caiga dentro de este sólido
        holes.forEach(hole => {
          if (pointInPoly({ x: hole.cx, y: hole.cy }, getWorldPoints(solid))) {
            const hPts = toMMPoints(hole);
            if (hPts.length >= 3) {
              const holePath = new THREE.Path(hPts);
              threeShape.holes.push(holePath);
            }
          }
        });

        const geom = new THREE.ExtrudeGeometry(threeShape, {
          depth: solid.height,
          bevelEnabled: solid.bevel > 0,
          bevelThickness: solid.bevel,
          bevelSize: solid.bevel,
          bevelSegments: 2
        });

        // Alinear la base exactamente en Z = 0
        geom.computeBoundingBox();
        geom.translate(0, 0, -geom.boundingBox.min.z);

        const mat = new THREE.MeshStandardMaterial({
          color: solid.id === selectedId ? 0x38bdf8 : 0x2563eb,
          roughness: 0.35,
          metalness: 0.15,
          wireframe: isWireframe
        });

        const mesh = new THREE.Mesh(geom, mat);
        meshGroup.add(mesh);
      });

      // Calcular caja delimitadora total del conjunto
      const box = new THREE.Box3().setFromObject(meshGroup);
      if (!box.isEmpty()) {
        const sx = (box.max.x - box.min.x).toFixed(1);
        const sy = (box.max.y - box.min.y).toFixed(1);
        const sz = (box.max.z - box.min.z).toFixed(1);
        document.getElementById('metrics3D').innerHTML = `
          <b>Volumen Total:</b><br>
          X: ${sx} mm | Y: ${sy} mm | Z: ${sz} mm<br>
          Piezas sólidas: ${solids.length} | Perforaciones: ${holes.length}
        `;
      } else {
        document.getElementById('metrics3D').innerHTML = `Sin sólidos activos en escena.`;
      }
    }

    // Controles de cámara 3D
    document.getElementById('btnCamTop').addEventListener('click', () => {
      camera.position.set(0, 0, 260);
      controls.target.set(0, 0, 0);
    });
    document.getElementById('btnCamIso').addEventListener('click', () => {
      camera.position.set(0, -190, 180);
      controls.target.set(0, 0, 0);
    });
    document.getElementById('btnWireframe').addEventListener('click', () => {
      isWireframe = !isWireframe;
      build3DScene();
    });

    // Pestañas 2D / 3D
    document.getElementById('tabDraw').addEventListener('click', () => {
      document.getElementById('tabDraw').classList.add('active');
      document.getElementById('tab3D').classList.remove('active');
      view2D.style.display = 'flex';
      view3D.style.display = 'none';
    });

    document.getElementById('tab3D').addEventListener('click', () => {
      document.getElementById('tab3D').classList.add('active');
      document.getElementById('tabDraw').classList.remove('active');
      view2D.style.display = 'none';
      view3D.style.display = 'block';

      const w = view3D.clientWidth;
      const h = view3D.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);

      build3DScene();
    });

    /* =========================================================
       EXPORTADOR STL BINARIO MULTI-PIEZA NATIVO
       ========================================================= */
    document.getElementById('btnExport').addEventListener('click', () => {
      build3DScene();
      if (meshGroup.children.length === 0) {
        alert("Agrega al menos una figura sólida antes de exportar.");
        return;
      }

      // Contar todos los triángulos de todas las piezas
      let totalTriangles = 0;
      const geometries = [];

      meshGroup.children.forEach(mesh => {
        const g = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry.clone();
        geometries.push(g);
        totalTriangles += g.attributes.position.count / 3;
      });

      const bufferSize = 84 + (totalTriangles * 50);
      const buffer = new ArrayBuffer(bufferSize);
      const view = new DataView(buffer);

      for (let i = 0; i < 80; i++) view.setUint8(i, 32);
      view.setUint32(80, totalTriangles, true);

      let offset = 84;
      const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
      const cb = new THREE.Vector3(), ab = new THREE.Vector3();

      geometries.forEach(g => {
        const pos = g.attributes.position;
        for (let i = 0; i < pos.count; i += 3) {
          vA.fromBufferAttribute(pos, i);
          vB.fromBufferAttribute(pos, i + 1);
          vC.fromBufferAttribute(pos, i + 2);

          // Calcular normal real de la cara para el laminador
          cb.subVectors(vC, vB);
          ab.subVectors(vA, vB);
          cb.cross(ab).normalize();

          view.setFloat32(offset, cb.x, true);
          view.setFloat32(offset + 4, cb.y, true);
          view.setFloat32(offset + 8, cb.z, true);
          offset += 12;

          [vA, vB, vC].forEach(v => {
            view.setFloat32(offset, v.x, true);
            view.setFloat32(offset + 4, v.y, true);
            view.setFloat32(offset + 8, v.z, true);
            offset += 12;
          });

          view.setUint16(offset, 0, true);
          offset += 2;
        }
      });

      const blob = new Blob([buffer], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pieza_cad_${Date.now()}.stl`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Loop de render 3D
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Inicializar con una brida / soporte mecánico de muestra (Placa + 2 perforaciones)
    animate();
    addShape('Placa Base', createRectPts(mid, mid, 80, 50), false, 8);
    addShape('Agujero Izq', createPolygonPts(mid - 35, mid, 8, 24), true, 8);
    addShape('Agujero Der', createPolygonPts(mid + 35, mid, 8, 24), true, 8);
    selectShape(shapes[0].id);
    render2D();
  </script>
</body>
</html>
