<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sketch3D CAD Pro - Vaciado y Cajas</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --card: #1e293b;
      --border: #334155;
      --accent: #2563eb;
      --accent-light: #38bdf8;
      --shell: #10b981;
      --danger: #ef4444;
      --hole: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-light);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #0284c7;
    }

    .header-actions { display: flex; gap: 6px; }

    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:active { opacity: 0.8; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.danger { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #fca5a5; }

    .tab-bar {
      display: flex;
      background: #060911;
      border-bottom: 1px solid var(--border);
      padding: 5px;
      gap: 5px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--accent-light);
      border: 1px solid var(--border);
    }

    .main-view {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #view2D {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding-bottom: 24px;
    }

    .toolbar-scroll {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tool-item {
      padding: 7px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tool-item.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
    }

    .canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
      background: #070a12;
    }

    canvas#cadCanvas {
      background: #0f172a;
      border-radius: 8px;
      border: 2px solid var(--border);
      touch-action: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .canvas-hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--muted);
      pointer-events: none;
      white-space: nowrap;
    }

    .inspector {
      background: var(--panel);
      margin: 6px 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inspector-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent-light);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .prop-box {
      background: var(--card);
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .prop-box.highlight-shell {
      border-color: var(--shell);
      background: rgba(16, 185, 129, 0.1);
    }

    .prop-label {
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .prop-label b { color: var(--text); }

    input[type="range"] {
      width: 100%;
      height: 20px;
      accent-color: var(--accent);
    }

    /* Selector de 3 modos: Sólido, Ahuecar (Caja), Perforación */
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }

    .mode-btn {
      padding: 7px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .mode-btn.solid.active {
      background: rgba(37, 99, 235, 0.25);
      border-color: var(--accent-light);
      color: #fff;
    }

    .mode-btn.shell.active {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--shell);
      color: #a7f3d0;
    }

    .mode-btn.hole.active {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--hole);
      color: #fde68a;
    }

    .layers-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .layer-chip {
      padding: 5px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.72rem;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .layer-chip.selected {
      border-color: var(--accent-light);
      background: rgba(56, 189, 248, 0.15);
      font-weight: 600;
    }

    #view3D {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #viewportWebGL {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .floating-3d-ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .metrics-pill {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.74rem;
      line-height: 1.4;
      pointer-events: auto;
    }

    .cam-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚙️ Sketch3D Pro</span>
      <span class="badge">Vaciado / Cajas</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="btnSnap">🧲 Imán: ON</button>
      <button class="btn primary" id="btnExport">📥 STL</button>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabDraw">📐 1. Boceto 2D y Piezas</button>
    <button class="tab-btn" id="tab3D">🧊 2. Modelo 3D Interactivo</button>
  </div>

  <div class="main-view">
    <!-- ==================== VISTA 2D ==================== -->
    <div id="view2D">
      <div class="toolbar-scroll">
        <button class="tool-item active" data-tool="select">👆 Mover</button>
        <button class="tool-item" data-tool="nodes">🔧 Nodos</button>
        <button class="tool-item" data-tool="freehand">✏️ Trazo</button>
        <button class="tool-item" id="addBox">📦 + Cubo Hueco</button>
        <button class="tool-item" id="addRect">⬛ + Bloque</button>
        <button class="tool-item" id="addCircle">⚪ + Cilindro</button>
      </div>

      <div class="canvas-container">
        <canvas id="cadCanvas" width="320" height="320"></canvas>
        <div class="canvas-hud" id="hudText">Cama: 220x220 mm</div>
      </div>

      <!-- Lista de Piezas -->
      <div class="inspector">
        <div class="inspector-title">
          <span>Piezas en Escena</span>
          <div style="display:flex; gap:6px;">
            <button class="btn" id="btnDuplicate" style="padding:3px 8px; font-size:0.7rem;">📋 Copiar</button>
            <button class="btn danger" id="btnDelete" style="padding:3px 8px; font-size:0.7rem;">🗑 Borrar</button>
          </div>
        </div>
        <div class="layers-bar" id="layersList"></div>
      </div>

      <!-- Inspector de Propiedades -->
      <div class="inspector" id="propPanel">
        <div class="inspector-title">
          <span id="selectedName">Propiedades de Pieza</span>
          <button class="btn" id="btnSmoothShape" style="padding:3px 8px; font-size:0.7rem;">✨ Suavizar</button>
        </div>

        <!-- 3 MODOS: Sólido, Ahuecar (Caja con fondo), Agujero/Rebaje -->
        <div class="mode-switch">
          <button class="mode-btn solid" id="btnModeSolid">➕ Sólido</button>
          <button class="mode-btn shell active" id="btnModeShell">📦 Ahuecar / Caja</button>
          <button class="mode-btn hole" id="btnModeHole">➖ Agujero / Rebaje</button>
        </div>

        <!-- Controles exclusivos de Ahuecado (Pared y Fondo) -->
        <div class="row-grid" id="shellControls">
          <div class="prop-box highlight-shell">
            <div class="prop-label"><span>Grosor Pared</span><b id="lblWall">3.0 mm</b></div>
            <input type="range" id="slWall" min="1" max="15" step="0.5" value="3">
          </div>
          <div class="prop-box highlight-shell">
            <div class="prop-label"><span>Piso / Fondo</span><b id="lblBottom">2.5 mm</b></div>
            <input type="range" id="slBottom" min="0" max="20" step="0.5" value="2.5">
          </div>
        </div>

        <!-- Controles Generales -->
        <div class="row-grid">
          <div class="prop-box">
            <div class="prop-label"><span>Altura Total (Z)</span><b id="lblHeight">25 mm</b></div>
            <input type="range" id="slHeight" min="1" max="80" step="1" value="25">
          </div>

          <div class="prop-box">
            <div class="prop-label"><span>Elevación Piso (Z0)</span><b id="lblZ0">0 mm</b></div>
            <input type="range" id="slZ0" min="0" max="50" step="1" value="0">
          </div>

          <div class="prop-box">
            <div class="prop-label"><span>Tamaño / Escala</span><b id="lblScale">100%</b></div>
            <input type="range" id="slScale" min="20" max="250" step="5" value="100">
          </div>

          <div class="prop-box">
            <div class="prop-label"><span>Rotación 2D</span><b id="lblRot">0°</b></div>
            <input type="range" id="slRot" min="0" max="360" step="5" value="0">
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== VISTA 3D ==================== -->
    <div id="view3D">
      <div class="floating-3d-ui">
        <div class="metrics-pill" id="metrics3D">Calculando...</div>
        <div class="cam-btns">
          <button class="btn" id="btnCamTop">⬇️ Planta</button>
          <button class="btn" id="btnCamIso">📐 Iso</button>
          <button class="btn" id="btnWireframe">🕸 Malla</button>
        </div>
      </div>
      <div id="viewportWebGL"></div>
    </div>
  </div>

  <script>
    const BED_MM = 220;
    const CANVAS_PX = 320;
    const PX_TO_MM = BED_MM / CANVAS_PX;
    const MM_TO_PX = CANVAS_PX / BED_MM;

    let shapes = [];
    let selectedId = null;
    let activeTool = 'select';
    let snapEnabled = true;

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let draggedNodeIdx = -1;
    let currentFreehandPts = [];

    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');

    function createPolygonPts(cx, cy, radiusMm, sides) {
      const pts = [];
      const rPx = radiusMm * MM_TO_PX;
      for (let i = 0; i < sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        pts.push({ x: cx + Math.cos(a) * rPx, y: cy + Math.sin(a) * rPx });
      }
      return pts;
    }

    function createRectPts(cx, cy, wMm, hMm) {
      const w = (wMm * MM_TO_PX) / 2;
      const h = (hMm * MM_TO_PX) / 2;
      return [
        { x: cx - w, y: cy - h },
        { x: cx + w, y: cy - h },
        { x: cx + w, y: cy + h },
        { x: cx - w, y: cy + h }
      ];
    }

    function getCentroid(pts) {
      let sx = 0, sy = 0;
      pts.forEach(p => { sx += p.x; sy += p.y; });
      return { x: sx / pts.length, y: sy / pts.length };
    }

    // mode: 'solid' | 'shell' (ahuecado) | 'hole' (corte)
    function addShape(name, points, mode = 'solid', height = 20, wall = 3, bottom = 2.5) {
      const id = 'shp_' + Date.now() + '_' + Math.floor(Math.random() * 100);
      const center = getCentroid(points);
      const relPoints = points.map(p => ({ x: p.x - center.x, y: p.y - center.y }));

      shapes.push({
        id,
        name,
        cx: center.x,
        cy: center.y,
        relPoints,
        mode,      // 'solid', 'shell', 'hole'
        height,    // Altura total Z (mm)
        z0: 0,     // Elevación desde la cama (mm)
        wall,      // Grosor de pared en modo 'shell' (mm)
        bottom,    // Espesor de piso en modo 'shell' (mm)
        scale: 1,
        rotation: 0
      });
      selectShape(id);
      render2D();
    }

    function getWorldPoints(shp, customScaleMultiplier = 1) {
      const rad = (shp.rotation * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const sc = shp.scale * customScaleMultiplier;
      return shp.relPoints.map(p => {
        const sx = p.x * sc;
        const sy = p.y * sc;
        return {
          x: shp.cx + (sx * cos - sy * sin),
          y: shp.cy + (sx * sin + sy * cos)
        };
      });
    }

    // Calcula el contorno interno contraído en milímetros exactos (para el vaciado de cajas)
    function getInsetWorldPoints(shp, insetMm) {
      const outerPts = getWorldPoints(shp);
      const insetPx = insetMm * MM_TO_PX;
      return outerPts.map(p => {
        const dx = p.x - shp.cx;
        const dy = p.y - shp.cy;
        const dist = Math.hypot(dx, dy);
        if (dist <= insetPx + 1) return { x: shp.cx, y: shp.cy };
        // Contracción proporcional en cada eje respecto al centroide
        const ratio = Math.max(0.05, (dist - insetPx) / dist);
        return {
          x: shp.cx + dx * ratio,
          y: shp.cy + dy * ratio
        };
      });
    }

    function updateNodeFromWorld(shp, nodeIdx, worldX, worldY) {
      const rad = (-shp.rotation * Math.PI) / 180;
      const dx = worldX - shp.cx;
      const dy = worldY - shp.cy;
      const rx = (dx * Math.cos(rad) - dy * Math.sin(rad)) / shp.scale;
      const ry = (dx * Math.sin(rad) + dy * Math.cos(rad)) / shp.scale;
      shp.relPoints[nodeIdx] = { x: rx, y: ry };
    }

    function snapCoord(valPx) {
      if (!snapEnabled) return valPx;
      const stepPx = 5 * MM_TO_PX;
      const center = CANVAS_PX / 2;
      return center + Math.round((valPx - center) / stepPx) * stepPx;
    }

    /* =========================================================
       RENDERIZADO 2D (MUESTRA PAREDES INTERNAS SI ESTÁ AHUECADO)
       ========================================================= */
    function render2D() {
      ctx.clearRect(0, 0, CANVAS_PX, CANVAS_PX);

      const step10mm = 10 * MM_TO_PX;
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i <= CANVAS_PX; i += step10mm) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_PX);
        ctx.moveTo(0, i); ctx.lineTo(CANVAS_PX, i);
        ctx.stroke();
      }

      const mid = CANVAS_PX / 2;
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(mid, 0); ctx.lineTo(mid, CANVAS_PX);
      ctx.moveTo(0, mid); ctx.lineTo(CANVAS_PX, mid);
      ctx.stroke();

      shapes.forEach(shp => {
        const pts = getWorldPoints(shp);
        if (pts.length < 2) return;

        const isSel = shp.id === selectedId;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();

        if (shp.mode === 'hole') {
          ctx.fillStyle = isSel ? 'rgba(245, 158, 11, 0.35)' : 'rgba(245, 158, 11, 0.15)';
          ctx.strokeStyle = isSel ? '#fbbf24' : '#d97706';
          ctx.setLineDash([5, 4]);
        } else if (shp.mode === 'shell') {
          ctx.fillStyle = isSel ? 'rgba(16, 185, 129, 0.28)' : 'rgba(16, 185, 129, 0.14)';
          ctx.strokeStyle = isSel ? '#3
