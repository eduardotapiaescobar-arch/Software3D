<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sketch3D - Print Ready</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
      font-weight: 700;
    }

    .badge {
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #0284c7;
    }

    .btn-export {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-export:active { background: var(--accent-hover); }

    /* Barra de pestañas */
    .tab-bar {
      display: flex;
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      padding: 6px;
      gap: 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: #38bdf8;
      border: 1px solid var(--border);
    }

    /* Contenedor principal */
    .main-view {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #view2D {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
    }

    .canvas-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      position: relative;
    }

    canvas#sketchCanvas {
      background: #0f172a;
      border-radius: 8px;
      border: 2px solid #334155;
      touch-action: none; /* CRÍTICO para Safari iOS */
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .tool-bar {
      display: flex;
      gap: 8px;
      padding: 0 14px 10px 14px;
    }

    .tool-btn {
      flex: 1;
      padding: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn.active { background: var(--accent); border-color: var(--accent); }
    .tool-btn.danger { flex: 0 0 50px; background: #3f1518; border-color: #7f1d1d; color: #f87171; }

    .controls-card {
      background: var(--card-bg);
      margin: 0 14px 14px 14px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .slider-header span:last-child {
      color: #38bdf8;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      height: 22px;
      accent-color: var(--accent);
    }

    /* Vista 3D */
    #view3D {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #viewportWebGL {
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .floating-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.4;
      pointer-events: none;
      z-index: 10;
    }
  </style>

  <!-- CDNs estables clásicos compatibles sin fallos de importación -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span>🔷 Sketch3D</span>
      <span class="badge">Ender Ready</span>
    </div>
    <button class="btn-export" id="btnExport">Descargar STL</button>
  </header>

  <!-- Pestañas -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabDraw">✏️ 1. Dibujar (2D)</button>
    <button class="tab-btn" id="tabPreview">🧊 2. Ver Modelo 3D</button>
  </div>

  <div class="main-view">
    <!-- VISTA 2D -->
    <div id="view2D">
      <div class="canvas-wrap">
        <canvas id="sketchCanvas" width="300" height="300"></canvas>
      </div>

      <div class="tool-bar">
        <button class="tool-btn active" id="btnStatus">Traza tu figura aquí 👆</button>
        <button class="tool-btn danger" id="btnClear" title="Limpiar">🗑</button>
      </div>

      <div class="controls-card">
        <div class="slider-row">
          <div class="slider-header">
            <span>Altura / Espesor (Z)</span>
            <span id="valHeight">8.0 mm</span>
          </div>
          <input type="range" id="paramHeight" min="1" max="50" step="1" value="8">
        </div>

        <div class="slider-row">
          <div class="slider-header">
            <span>Biselado de borde</span>
            <span id="valBevel">0.8 mm</span>
          </div>
          <input type="range" id="paramBevel" min="0" max="3" step="0.2" value="0.8">
        </div>
      </div>
    </div>

    <!-- VISTA 3D -->
    <div id="view3D">
      <div class="floating-info" id="metricsBox">
        Gira con 1 dedo | Zoom con 2<br>
        Cama: 220 x 220 mm
      </div>
      <div id="viewportWebGL"></div>
    </div>
  </div>

  <script>
    // Parámetros de escala (Cama Ender 220x220 mm)
    const BED_SIZE_MM = 220;
    const CANVAS_PX = 300;
    const SCALE = BED_SIZE_MM / CANVAS_PX; // 0.73 mm por pixel

    let points = [];
    let isDrawing = false;
    let solidMesh = null;

    const canvas = document.getElementById('sketchCanvas');
    const ctx = canvas.getContext('2d');
    const view2D = document.getElementById('view2D');
    const view3D = document.getElementById('view3D');
    const container3D = document.getElementById('viewportWebGL');

    // 1. CONFIGURACIÓN THREE.JS
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    const camera = new THREE.PerspectiveCamera(45, 1, 1, 1000);
    camera.position.set(0, -180, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container3D.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    // Luces
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 100, 150);
    scene.add(dirLight);

    // Cama de impresión
    const grid = new THREE.GridHelper(BED_SIZE_MM, 22, 0x0284c7, 0x1e293b);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    function resize3D() {
      const w = view3D.clientWidth;
      const h = view3D.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    // 2. NAVEGACIÓN ENTRE PESTAÑAS
    document.getElementById('tabDraw').addEventListener('click', () => {
      document.getElementById('tabDraw').classList.add('active');
      document.getElementById('tabPreview').classList.remove('active');
      view2D.style.display = 'flex';
      view3D.style.display = 'none';
    });

    document.getElementById('tabPreview').addEventListener('click', () => {
      document.getElementById('tabPreview').classList.add('active');
      document.getElementById('tabDraw').classList.remove('active');
      view2D.style.display = 'none';
      view3D.style.display = 'block';

      resize3D();
      generate3D();
    });

    // 3. DIBUJO EN CANVAS COMPATIBLE CON TOUCH DE IPHONE
    function drawGrid() {
      ctx.clearRect(0, 0, CANVAS_PX, CANVAS_PX);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i <= CANVAS_PX; i += 30) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_PX);
        ctx.moveTo(0, i); ctx.lineTo(CANVAS_PX, i);
        ctx.stroke();
      }
    }

    function redraw() {
      drawGrid();
      if (points.length < 2) return;

      ctx.beginPath();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }

      if (!isDrawing && points.length > 2) {
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.fill();
      }
      ctx.stroke();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDraw(e) {
      e.preventDefault();
      isDrawing = true;
      points = [getPos(e)];
      redraw();
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      const last = points[points.length - 1];
      if (Math.hypot(pos.x - last.x, pos.y - last.y) > 4) {
        points.push(pos);
        redraw();
      }
    }

    function stopDraw(e) {
      if (isDrawing) {
        isDrawing = false;
        redraw();
      }
    }

    // Soporte táctil estricto para Safari iOS
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', stopDraw, { passive: false });

    // Soporte Mouse
    canvas.addEventListener('mousedown', startDraw);
    window.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', stopDraw);

    document.getElementById('btnClear').addEventListener('click', () => {
      points = [];
      drawGrid();
      if (solidMesh) {
        scene.remove(solidMesh);
        solidMesh = null;
      }
    });

    // 4. SLIDERS
    const inHeight = document.getElementById('paramHeight');
    const inBevel = document.getElementById('paramBevel');

    inHeight.addEventListener('input', (e) => {
      document.getElementById('valHeight').innerText = `${e.target.value}.0 mm`;
    });
    inBevel.addEventListener('input', (e) => {
      document.getElementById('valBevel').innerText = `${e.target.value} mm`;
    });

    // 5. GENERACIÓN DE SÓLIDO 3D
    function generate3D() {
      if (points.length < 3) return;

      const h = parseFloat(inHeight.value);
      const b = parseFloat(inBevel.value);

      const shape = new THREE.Shape();
      const mid = CANVAS_PX / 2;

      // Trasladar al centro y pasar a mm
      shape.moveTo((points[0].x - mid) * SCALE, -(points[0].y - mid) * SCALE);
      for (let i = 1; i < points.length; i++) {
        shape.lineTo((points[i].x - mid) * SCALE, -(points[i].y - mid) * SCALE);
      }
      shape.closePath();

      if (solidMesh) scene.remove(solidMesh);

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: h,
        bevelEnabled: b > 0,
        bevelThickness: b,
        bevelSize: b,
        bevelSegments: 2
      });

      geom.computeBoundingBox();
      // Apoyar en Z = 0
      geom.translate(0, 0, -geom.boundingBox.min.z);

      const mat = new THREE.MeshStandardMaterial({
        color: 0x2563eb,
        roughness: 0.35,
        metalness: 0.1
      });

      solidMesh = new THREE.Mesh(geom, mat);
      scene.add(solidMesh);

      const bb = geom.boundingBox;
      document.getElementById('metricsBox').innerHTML = `
        Pieza: ${(bb.max.x - bb.min.x).toFixed(1)} x ${(bb.max.y - bb.min.y).toFixed(1)} x ${(bb.max.z - bb.min.z).toFixed(1)} mm<br>
        Gira: 1 dedo | Zoom: pellizco
      `;
    }

    // 6. EXPORTADOR STL BINARIO 100% NATIVO (Sin librerías externas)
    function downloadBinarySTL() {
      if (!solidMesh) generate3D();
      if (!solidMesh) {
        alert("Dibuja una figura antes de exportar.");
        return;
      }

      const geom = solidMesh.geometry.clone();
      const pos = geom.attributes.position;
      const count = pos.count;
      const triangles = count / 3;

      // 80 bytes cabecera + 4 bytes num_triangulos + 50 bytes por triangulo
      const bufferSize = 84 + (triangles * 50);
      const buffer = new ArrayBuffer(bufferSize);
      const view = new DataView(buffer);

      // Cabecera STL
      for (let i = 0; i < 80; i++) view.setUint8(i, 32);
      view.setUint32(80, triangles, true);

      let offset = 84;
      for (let i = 0; i < count; i += 3) {
        // Normal (0, 0, 1 por defecto)
        view.setFloat32(offset, 0, true);
        view.setFloat32(offset + 4, 0, true);
        view.setFloat32(offset + 8, 1, true);
        offset += 12;

        // Vértices A, B, C
        for (let j = 0; j < 3; j++) {
          view.setFloat32(offset, pos.getX(i + j), true);
          view.setFloat32(offset + 4, pos.getY(i + j), true);
          view.setFloat32(offset + 8, pos.getZ(i + j), true);
          offset += 12;
        }

        // Atributo de byte (0)
        view.setUint16(offset, 0, true);
        offset += 2;
      }

      const blob = new Blob([buffer], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `dibujo3d_${Date.now()}.stl`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById('btnExport').addEventListener('click', downloadBinarySTL);

    // Animación 3D
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Inicializar con un hexágono por defecto
    drawGrid();
    animate();

    const m = CANVAS_PX / 2;
    points = [
      {x: m - 45, y: m - 30}, {x: m + 45, y: m - 30},
      {x: m + 60, y: m},      {x: m + 45, y: m + 30},
      {x: m - 45, y: m + 30}, {x: m - 60, y: m}
    ];
    redraw();
  </script>
</body>
</html>
